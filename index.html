<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 2반 분실물 보관함</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #64748b;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .item-list {
            display: grid;
            gap: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .item-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .item-info p {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 3px;
        }

        .item-info .date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 650;
            margin-bottom: 5px;
        }

        .badge.active {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .badge.resolved {
            background-color: #dcfce7;
            color: #16a34a;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏫 2학년 2반 분실물 보관함</h1>
            <p>교실에서 물건을 잃어버렸거나 주웠다면 여기에 등록해주세요!</p>
        </header>

        <!-- 분실물 등록 폼 -->
        <div class="card">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">✨ 분실물 등록하기</h2>
            <form id="lostForm">
                <div class="form-group">
                    <label for="itemName">물건 이름</label>
                    <input type="text" id="itemName" placeholder="예: 무선 이어폰 케이스, 볼펜" required>
                </div>
                <div class="form-group">
                    <label for="itemLocation">발견 장소 / 특징</label>
                    <input type="text" id="itemLocation" placeholder="예: 칠판 앞 모퉁이 / 검은색" required>
                </div>
                <div class="form-group">
                    <label for="itemAuthor">등록자 (이름 또는 번호)</label>
                    <input type="text" id="itemAuthor" placeholder="예: 2번 김철수" required>
                </div>
                <button type="submit">등록하기</button>
            </form>
        </div>

        <!-- 분실물 목록 -->
        <div class="card">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">📋 등록된 분실물 목록</h2>
            <div id="itemList" class="item-list">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>
        </div>
    </div>

    <script>
        // 로컬스토리지에서 데이터 불러오기 (새로고침해도 유지됨)
        let items = JSON.parse(localStorage.getItem('class_lost_items')) || [];

        const form = document.getElementById('lostForm');
        const itemList = document.getElementById('itemList');

        function saveAndRender() {
            localStorage.setItem('class_lost_items', JSON.stringify(items));
            renderItems();
        }

        function renderItems() {
            itemList.innerHTML = '';

            if (items.length === 0) {
                itemList.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">등록된 분실물이 없습니다. 🎉</p>';
                return;
            }

            items.forEach((item, index) => {
                const itemCard = document.createElement('div');
                itemCard.className = 'item-card';

                const statusBadge = item.resolved 
                    ? '<span class="badge resolved">주인 찾음 ✅</span>' 
                    : '<span class="badge active">찾는 중 🔍</span>';

                itemCard.innerHTML = `
                    <div class="item-info">
                        ${statusBadge}
                        <h3>${item.name}</h3>
                        <p>📍 위치/특징: ${item.location}</p>
                        <p>👤 등록자: ${item.author}</p>
                        <span class="date">${item.date}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-sm btn-secondary" onclick="toggleStatus(${index})">
                            ${item.resolved ? '다시 찾는 중으로' : '찾아줌완료'}
                        </button>
                        <button class="btn-sm btn-danger" onclick="deleteItem(${index})">삭제</button>
                    </div>
                `;
                itemList.appendChild(itemCard);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const newItem = {
                name: document.getElementById('itemName').value,
                location: document.getElementById('itemLocation').value,
                author: document.getElementById('itemAuthor').value,
                date: new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                resolved: false
            };

            items.unshift(newItem); // 최신글이 위로 오도록
            saveAndRender();
            form.reset();
        });

        window.toggleStatus = function(index) {
            items[index].resolved = !items[index].resolved;
            saveAndRender();
        }

        window.deleteItem = function(index) {
            if (confirm('이 분실물 기록을 삭제하시겠습니까?')) {
                items.splice(index, 1);
                saveAndRender();
            }
        }

        // 초기 렌더링 실행
        renderItems();
    </script>
</body>
</html>
